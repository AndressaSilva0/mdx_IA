services:
  - type: web
    name: mermas-digitais-mdx2026
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn mdx_project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: USE_SQLITE
        value: "True"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.1-flash-lite"

