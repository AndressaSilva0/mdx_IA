<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#6D28D9" stroke-width="0.75" stroke-opacity="0.12" />
    </pattern>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEBE01" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Fundo Lilás Suave com Grid -->
  <rect width="800" height="500" rx="28" fill="#FAF5FF" />
  <rect width="800" height="500" rx="28" fill="url(#grid-pattern)" />

  <!-- Borda Tracejada Neo-Pop -->
  <rect x="16" y="16" width="768" height="468" rx="20" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="10 8" stroke-opacity="0.6" />

  <!-- Container Central -->
  <g transform="translate(400, 210)">
    <!-- Sombra Sólida Neo-Pop -->
    <rect x="-44" y="-44" width="96" height="96" rx="24" fill="#1E0B36" />
    <!-- Caixa do Ícone -->
    <rect x="-48" y="-48" width="96" height="96" rx="24" fill="url(#badge-grad)" stroke="#1E0B36" stroke-width="3" />

    <!-- Ícone de Câmera e Varinha Mágica -->
    <text x="0" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" text-anchor="middle" dominant-baseline="middle">🎨</text>

    <!-- Pílula de Status -->
    <g transform="translate(0, 90)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#6D28D9" stroke="#1E0B36" stroke-width="2" />
      <text x="0" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
        AGUARDANDO GERAÇÃO DE IMAGEM
      </text>
    </g>

    <!-- Textos Explicativos -->
    <text x="0" y="150" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="900" fill="#1E0B36" text-anchor="middle">
      Nenhuma Imagem Selecionada Ainda
    </text>
    <text x="0" y="180" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">
      Preencha o prompt acima e clique em "Gerar com IA", faça upload ou use um modelo pronto.
    </text>
  </g>
</svg>
